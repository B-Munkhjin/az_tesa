<section class="section section-tint" id="selfcheck">
  <div class="container narrow">
    <p class="eyebrow center">ӨӨРИЙГӨӨ ШАЛГАХ</p>
    <h2 class="section-title center">Дараах шинжүүдээс хэдийг мэдэрч байна вэ?</h2>
    <p class="section-sub center">Тохирох зүйлээ сонгоод үр дүнгээ хараарай.</p>

    <form id="selfCheckForm" class="selfcheck-form" onsubmit="return false;">
      <div class="check-grid">
        <label class="check-item"><input type="checkbox"><span>Түгшүүр, сэтгэл гутрал ихэссэн</span></label>
        <label class="check-item"><input type="checkbox"><span>Амархан уурладаг болсон</span></label>
        <label class="check-item"><input type="checkbox"><span>Өөртөө итгэх итгэл буурсан</span></label>
        <label class="check-item"><input type="checkbox"><span>Байнга ядардаг, сульдсан мэдрэмж</span></label>
        <label class="check-item"><input type="checkbox"><span>Хоолны дуршил эрс өөрчлөгдсөн</span></label>
        <label class="check-item"><input type="checkbox"><span>Нойрны хэмнэл алдагдсан</span></label>
        <label class="check-item"><input type="checkbox"><span>Үүрэг хариуцлагаас зайлсхийдэг болсон</span></label>
        <label class="check-item"><input type="checkbox"><span>Найз нөхөдтэйгээ харилцаа багассан</span></label>
        <label class="check-item"><input type="checkbox"><span>Гэр бүлээсээ холдсон</span></label>
      </div>

      <button type="button" id="selfCheckBtn" class="btn btn-primary">Үр дүнг харах</button>
    </form>

    <div id="selfCheckResult" class="selfcheck-result" hidden></div>

    <p class="disclaimer">Энэ бол эмнэлгийн онош биш, зөвхөн ерөнхий ойлголт өгөх зорилготой. Нарийвчилсан үнэлгээ авахын тулд мэргэжлийн эмч, сэтгэл зүйчид хандана уу.</p>
  </div>
</section>
