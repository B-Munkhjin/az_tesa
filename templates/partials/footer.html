<footer class="site-footer">

      <span class="footer-brand-sub">{{ clinic.tagline }}</span>
    </div>

    <div class="footer-cols">
      <div class="footer-col">
        <div class="finfo-label">Ажиллах цаг</div>
        <div class="finfo-value">

          clinic.hours_saturday }}

      </div>
      <div class="footer-col">
        <div class="finfo-label">Холбогдох дугаар</div>
        <div class="finfo-value">{{ clinic.phones|join(', ') }}</div>

        <div class="finfo-value footer-links">

            target="_blank"
            rel="noopener noreferrer"
            >Facebook</a
          >
          <a href="mailto:aztesa.addiction@gmail.com"

          >
        </div>
      </div>
      <div class="footer-col">
        <div class="finfo-label">Хаяг</div>
        <div class="finfo-value">{{ clinic.address }}</div>
      </div>
    </div>

    <div class="footer-bottom">
      © {{ clinic.name }}. Бүх эрх хуулиар хамгаалагдсан.
    </div>
